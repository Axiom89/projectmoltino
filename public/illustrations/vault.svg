<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360">
  <style>
    :root { --ink:#172036; --yolk:#F6C744; --yolk-shade:#E2AE1C; --paper:#FFFFFF; --steel:#AEB6C6; --steel-dk:#7F889C; --spiral:#3F55E0; --spiral-lt:#B9C2F7; --flag:#D0442C; }
    .o { stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <!-- backing disc so the piece holds on the dark band -->
  <circle id="disc" cx="200" cy="180" r="168" fill="var(--yolk)"/>

  <!-- hard offset shadow -->
  <circle cx="210" cy="190" r="118" fill="var(--ink)"/>

  <!-- vault door: the shell, armoured -->
  <g id="door">
    <circle cx="200" cy="180" r="118" fill="var(--steel)" class="o"/>
    <circle cx="200" cy="180" r="92" fill="none" stroke="var(--steel-dk)" stroke-width="10"/>
    <!-- bolts -->
    <g fill="var(--paper)" class="o" stroke-width="5">
      <circle cx="200" cy="80" r="9"/><circle cx="200" cy="280" r="9"/>
      <circle cx="100" cy="180" r="9"/><circle cx="300" cy="180" r="9"/>
      <circle cx="129" cy="109" r="9"/><circle cx="271" cy="251" r="9"/>
      <circle cx="271" cy="109" r="9"/><circle cx="129" cy="251" r="9"/>
    </g>
    <!-- spiral lens, like Moltino's shell -->
    <circle cx="200" cy="180" r="62" fill="var(--spiral)" class="o"/>
    <path d="M200 180 m0 -6 a6 6 0 1 1 -6 6 a13 13 0 0 1 13 -13 a20 20 0 0 1 20 20 a27 27 0 0 1 -27 27 a34 34 0 0 1 -34 -34 a41 41 0 0 1 41 -41"
          fill="none" stroke="var(--spiral-lt)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- padlock hanging off the rim -->
  <g id="lock">
    <rect x="276" y="236" width="76" height="62" rx="12" fill="var(--ink)" transform="translate(7 7)"/>
    <path d="M292 240 v-18 a22 22 0 0 1 44 0 v18" fill="none" class="o" stroke-width="9"/>
    <rect x="276" y="236" width="76" height="62" rx="12" fill="var(--paper)" class="o"/>
    <circle cx="314" cy="262" r="8" fill="var(--ink)"/>
    <path d="M314 266 v14" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
